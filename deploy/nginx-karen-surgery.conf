# Karen Surgery — Production Nginx Virtual Host
# Target path on Linux VM: /etc/nginx/sites-available/karen-surgery
# Symlink to enable:       sudo ln -s /etc/nginx/sites-available/karen-surgery /etc/nginx/sites-enabled/
#
# Replace karensurgery.com / www.karensurgery.com with your final domain if deploying to a staging hostname first.
# Run Certbot after DNS points to your VM:
#   sudo certbot --nginx -d karensurgery.com -d www.karensurgery.com

server {
    listen 80;
    listen [::]:80;
    server_name karensurgery.com www.karensurgery.com;

    # Allow Let's Encrypt HTTP-01 challenge before HTTPS redirect
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect bare domain & HTTP traffic cleanly once TLS is active
    # (Certbot will add the HTTPS server block below or manage this redirect automatically)
    root /var/www/karen-surgery/current;
    index index.html;

    # Hide Nginx version banner
    server_tokens off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.tile.openstreetmap.org https://api.karensurgery.com; font-src 'self' data:; connect-src 'self' https://api.karensurgery.com; base-uri 'self'; form-action 'self'; frame-ancestors 'self';" always;

    # Uncomment HSTS once HTTPS / TLS certificate is verified working:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Legacy sitemap URL 301 redirects
    location = /medical-info/child-immunization-schedule {
        return 301 /medical-info/;
    }
    location = /medical-info/child-immunization-schedule/ {
        return 301 /medical-info/;
    }

    # Immutable static assets (hashed Next.js chunks & optimized images)
    location ^~ /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location ^~ /images/ {
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400";
        access_log off;
    }

    # HTML documents: always revalidate (preserves browser bfcache — avoids no-store)
    location / {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        try_files $uri $uri/ $uri.html =404;
    }

    # Custom 404 page generated by Next.js static export
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Block hidden dot-files
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }
}
