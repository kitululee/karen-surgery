# Karen Surgery — Phase 2 Backend API & Independent Admin Portal Nginx Virtual Hosts
# Target path on Linux VM: /etc/nginx/sites-available/karen-surgery-phase2
# Symlink to enable:       sudo ln -s /etc/nginx/sites-available/karen-surgery-phase2 /etc/nginx/sites-enabled/
# Provision TLS via Certbot:
#   sudo certbot --nginx -d api.karensurgery.com -d admin.karensurgery.com

# ---------------------------------------------------------------------------
# 1. Backend API Reverse Proxy (api.karensurgery.com -> 127.0.0.1:4000)
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name api.karensurgery.com;

    server_tokens off;
    client_max_body_size 10m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Security headers (TLS + HSTS managed after certbot)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}

# ---------------------------------------------------------------------------
# 2. Independent Administration Portal (admin.karensurgery.com)
# Never linked from public navigation; blocked from search engine indexing.
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name admin.karensurgery.com;

    server_tokens off;
    root /var/www/karen-surgery-admin/current;
    index index.html;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Strict Admin Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://api.karensurgery.com https://www.karensurgery.com; connect-src 'self' https://api.karensurgery.com; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }
}
